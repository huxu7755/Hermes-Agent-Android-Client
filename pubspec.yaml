name: hermes_agent_android
description: hermes-agent Android client - Self-improving AI agent on Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  battery_plus: ^6.0.0
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.4
  web_socket_channel: ^3.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
