name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone hermes-agent submodule
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git ../hermes-agent-submodule
          mv ../hermes-agent-submodule/* ./
          mv ../hermes-agent-submodule/.* . 2>/dev/null || true
          rm -rf ../hermes-agent-submodule

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug
        timeout-minutes: 30

      - name: Build release APK
        run: flutter build apk --release
        timeout-minutes: 30

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload debug APK to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload release APK to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
